<!doctype html>
<html lang="{{ site.lang | default: 'en' }}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="{{ page.description | default: site.description }}">
  <meta name="theme-color" content="#f4f0e7">
  <title>{% if page.title %}{{ page.title }} — {% endif %}{{ site.title }}</title>
  <script>
    // Runs before first paint so dark-mode visitors never see a light flash.
    (function () {
      var theme;
      try { theme = localStorage.getItem("theme"); } catch (e) {}
      if (theme === "dark" || (!theme && matchMedia("(prefers-color-scheme: dark)").matches)) {
        document.documentElement.dataset.theme = "dark";
        document.querySelector('meta[name="theme-color"]').content = "#181c19";
      }
    })();
  </script>
  <link rel="preload" href="{{ '/assets/fonts/newsreader-normal-latin.woff2' | relative_url }}" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="{{ '/assets/fonts/hanken-grotesk-normal-latin.woff2' | relative_url }}" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="{{ '/assets/fonts/fonts.css' | relative_url }}">
  <link rel="stylesheet" href="{{ '/styles.css' | relative_url }}">
  <link rel="icon" href="{{ '/assets/favicon.svg' | relative_url }}" type="image/svg+xml">
  <script src="{{ '/script.js' | relative_url }}" defer></script>
</head>
<body>
  <a class="skip-link" href="#main">Skip to content</a>
  <header class="site-header">
    <a class="wordmark" href="{{ '/' | relative_url }}" aria-label="Home">Y<span>.</span> Li</a>
    <button class="theme-toggle" type="button" aria-label="Toggle color theme" title="Toggle color theme"><span aria-hidden="true">◐</span></button>
  </header>

  <main id="main">
{{ content }}
  </main>

  <footer>
    <p>© <span id="year">{{ site.time | date: "%Y" }}</span> {{ site.author }}</p>
    <p>Hosted on GitHub Pages.</p>
  </footer>
</body>
</html>
