---
layout: default
---
<header class="page-header">
  <p class="breadcrumb"><a href="{{ '/' | relative_url }}">Home</a> / {{ page.breadcrumb | default: page.title }}</p>
  <p class="eyebrow">{{ page.eyebrow | escape }}</p>
  <h1>{{ page.title }}</h1>
  <p class="lede">{{ page.lede }}</p>
</header>
<div class="content">
{{ content }}
</div>
