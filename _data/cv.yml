- id: research
  section: Research
  items:
    - dates: "2026"
      title: 'The model theory of curve graphs and $\operatorname{Out}(F_n)$'
      detail: MSc dissertation · Supervised by Prof. Dawid Kielak, University of Oxford
      summary: >-
        Studied rigidity phenomena linking mapping class groups, $\operatorname{Out}(\pi_1(\Sigma))$,
        and $\operatorname{Aut}(\mathscr{C}(\Sigma))$, from both topological and
        model-theoretic viewpoints. Extended the approach to $\operatorname{Out}(F_n)$.
      # url: /assets/dissertation.pdf
    - dates: 2024 - 2025
      title: Geometric group theory and mapping class groups
      detail: Final year project · Supervised by Prof. Robert Tang, XJTLU
      summary: >-
        Foundations of geometric group theory and mapping class groups, with Gromov
        hyperbolicity of curve graphs.
      # url: /assets/final-year-project.pdf
    - dates: "2024"
      title: Packing edge-colorings of subcubic outerplanar graphs
      detail: Research project with Sijin Li and Xujun Liu
      summary: >-
        Proved packing edge-coloring results for subcubic outerplanar graphs, towards a conjecture
        of Hocquard et al., and established counterexamples for several packing-coloring parameters. Published in
        <em>Discrete Applied Mathematics</em> (2026).
      url: "https://doi.org/10.1016/j.dam.2026.04.033"

